name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # 明确钉在 24.04：ubuntu-latest 将于 2026-10-19 迁到 Ubuntu 26，发版流水线
    # 不宜跟着镜像漂移（zip/git 等工具行为差异），要升级时显式改这一行
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag matches module.prop version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROP_VERSION="$(grep '^version=' module.prop | cut -d= -f2)"
          if [ "$TAG_VERSION" != "$PROP_VERSION" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 module.prop 的 version=$PROP_VERSION 不一致"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # 发布前必须过测试：此前 release 流程只构建、从不跑 go test，
      # 单测（171 个）实际上只在本机生效，回归会静默进入发布产物。
      - name: Go vet and test
        run: |
          go vet ./...
          go test ./... -count=1

      - name: Build batteryd
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o bin/batteryd ./cmd/batteryd

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 先构建 webroot/（源码在 webui/），并按离线与 gzip 上限守卫产物；
      # 下面两个 zip 都直接打包这个生成目录。
      - name: Build and guard WebUI
        run: |
          pnpm install --frozen-lockfile
          pnpm run verify

      - name: Pack stable zip
        run: |
          VERSION="$(grep '^version=' module.prop | cut -d= -f2)"
          VERSION_CODE="$(grep '^versionCode=' module.prop | cut -d= -f2)"
          [ -n "$VERSION_CODE" ] || { echo "::error::module.prop 缺少 versionCode"; exit 1; }
          # 资产名沿用 KernelSU module-release action 的规范：{id}-{versionCode}-{version}.zip
          echo "ASSET_NAME=CRecordEvolution-${VERSION_CODE}-${VERSION}.zip" >> "$GITHUB_ENV"
          echo "ML_ASSET_NAME=CRecordEvolution_ML-${VERSION_CODE}-${VERSION}.zip" >> "$GITHUB_ENV"
          zip -r "CRecordEvolution-${VERSION_CODE}-${VERSION}.zip" module.prop customize.sh service.sh action.sh bin webroot META-INF THIRD_PARTY_NOTICES.txt

      - name: Build batteryd (ML)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.channel=ml" -o bin/batteryd.ml ./cmd/batteryd

      - name: Pack ML zip
        run: |
          rm -rf mlstage && mkdir mlstage
          cp -r module.prop customize.sh service.sh action.sh bin webroot META-INF THIRD_PARTY_NOTICES.txt mlstage/
          mv bin/batteryd.ml mlstage/bin/batteryd
          rm -f mlstage/bin/batteryd.ml
          sed -i 's/^name=.*/name=ChargingRecord Evolution ML/' mlstage/module.prop
          sed -i 's/^description=/description=[ML实验版]/' mlstage/module.prop
          sed -i '/^updateJson=/d' mlstage/module.prop
          cd mlstage && zip -r "../${ML_ASSET_NAME}" . && cd ..

      - name: Generate changelog
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG..${GITHUB_REF_NAME}" --pretty='- %s' > changelog.txt
          else
            git log --pretty='- %s' > changelog.txt
          fi
          # 这份文件同时作为 release notes（KernelSU 模块页/更新弹窗的更新日志）
          # 与 update.json 的 changelog 资产，保持 Markdown 可读
          printf '\n`%s` 为实验通道（在线学习算法），手动刷入，不提供应用内更新。\n' "${ML_ASSET_NAME}" >> changelog.txt

      # 官方校验器：发布前检查 ZIP 结构、module.prop、versionCode 是否大于上一版、
      # assetPattern 是否只命中一个资产；失败则不会创建 release，不浪费不可变版本号
      - name: KernelSU Modules precheck
        uses: KernelSU-Modules/tools/actions/module-release@72a151d23b3e655ac2e331dd0a1eb30a2b0e37e9
        with:
          zip: ${{ env.ASSET_NAME }}
          dry-run: true

      # 仓库开启 release immutability 后，资源只能在 release 仍为 draft 时上传：
      # 先建 draft、传完资源，再由下一步发布（发布瞬间才锁定）。
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ChargingRecord Evolution ${{ github.ref_name }}
          # release notes 同时是 KernelSU 模块页与更新弹窗里的更新日志
          body_path: changelog.txt
          draft: true
          # v3 的合法输入是 overwrite_files（旧版写成 overwrite，会报
          # "Unexpected input(s) 'overwrite'"）
          overwrite_files: true
          files: |
            ${{ env.ASSET_NAME }}
            ${{ env.ML_ASSET_NAME }}
            changelog.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --draft=false
          # 未开启 immutability 时 KernelSU Modules 会拒收该 release（release-not-immutable），
          # 这里只告警不失败：资源已发布，失败也撤不回来
          IMMUTABLE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .immutable)"
          if [ "$IMMUTABLE" != "true" ]; then
            echo "::warning::release ${GITHUB_REF_NAME} 不是 immutable，请到 Settings → General → Releases 开启 Enable release immutability 后发下一个版本"
          fi

      - name: Update update.json on main
        run: |
          VERSION="$(grep '^version=' module.prop | cut -d= -f2)"
          VERSION_CODE="$(grep '^versionCode=' module.prop | cut -d= -f2)"
          [ -n "$VERSION_CODE" ] || { echo "::error::module.prop 缺少 versionCode"; exit 1; }
          printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "zipUrl": "https://github.com/f1owkang/CRecordEvolution/releases/download/%s/%s",\n  "changelog": "https://github.com/f1owkang/CRecordEvolution/releases/download/%s/changelog.txt"\n}\n' "$VERSION" "$VERSION_CODE" "${GITHUB_REF_NAME}" "$ASSET_NAME" "${GITHUB_REF_NAME}" > update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json 已是最新"
          else
            git commit -m "add: update.json 更新至 ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi
