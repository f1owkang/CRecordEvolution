name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches module.prop version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROP_VERSION="$(grep '^version=' module.prop | cut -d= -f2)"
          if [ "$TAG_VERSION" != "$PROP_VERSION" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 module.prop 的 version=$PROP_VERSION 不一致"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build batteryd
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o bin/batteryd ./cmd/batteryd

      - name: Pack stable zip
        run: |
          zip -r Charging_Record.zip module.prop customize.sh service.sh action.sh bin webroot META-INF

      - name: Pack ML zip
        run: |
          rm -rf mlstage && mkdir mlstage
          cp -r module.prop customize.sh service.sh action.sh bin webroot META-INF mlstage/
          sed -i 's/^name=.*/name=Charging Record ML/' mlstage/module.prop
          sed -i 's/^description=/description=[ML实验版]/' mlstage/module.prop
          sed -i '/^updateJson=/d' mlstage/module.prop
          cd mlstage && zip -r ../Charging_Record_ML.zip . && cd ..

      - name: Generate changelog
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG..${GITHUB_REF_NAME}" --oneline > changelog.txt
          else
            git log --oneline > changelog.txt
          fi
          printf '%s\n' 'Charging_Record_ML.zip 为实验通道（在线学习算法），手动刷入，不提供应用内更新' >> changelog.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Charging_Record.zip
            Charging_Record_ML.zip
            changelog.txt

      - name: Update update.json on main
        run: |
          VERSION="$(grep '^version=' module.prop | cut -d= -f2)"
          VERSION_CODE="$(grep '^versionCode=' module.prop | cut -d= -f2)"
          [ -n "$VERSION_CODE" ] || { echo "::error::module.prop 缺少 versionCode"; exit 1; }
          printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "zipUrl": "https://github.com/f1owkang/CRecordEvolution/releases/latest/download/Charging_Record.zip",\n  "changelog": "https://github.com/f1owkang/CRecordEvolution/releases/latest/download/changelog.txt"\n}\n' "$VERSION" "$VERSION_CODE" > update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json 已是最新"
          else
            git commit -m "add: update.json 更新至 ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi
