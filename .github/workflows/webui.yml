name: WebUI

on:
  push:
    branches: [main]
    paths:
      - 'webui/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.js'
      - '.github/workflows/webui.yml'
  pull_request:
    paths:
      - 'webui/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.js'
      - '.github/workflows/webui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 构建到 webroot/，并按 50KB gzip 上限与“无远程请求/外部 URL”扫描产物
      - name: Build and guard
        run: pnpm run verify

      - name: Smoke test (headless Chrome)
        run: pnpm run smoke

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webui-smoke
          path: artifacts/smoke
          if-no-files-found: ignore
