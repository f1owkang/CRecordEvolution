name: Bug report / 问题反馈
description: 电池估算、WebUI 或安装异常时，用脱敏诊断快速定位
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先使用最新 [Release](https://github.com/f1owkang/CRecordEvolution/releases) 并重启。
        诊断来自「设置 → 数据 → 复制诊断」或 `/data/adb/modules/CRecordEvolution/bin/batteryd diag`，
        已脱敏（无序列号 / IMEI / MAC / 账号），请直接粘贴文本，不要只发截图。
  - type: input
    id: version
    attributes:
      label: 版本与通道 / Version & channel
      description: 见「关于」页或管理器模块页；注明 stable 或 ML
      placeholder: 1.3.6(35) stable
    validations:
      required: true
  - type: dropdown
    id: root
    attributes:
      label: Root 管理器 / Root manager
      options:
        - Magisk
        - KernelSU
        - APatch
        - MMRL
        - 其他 / Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 机型与系统 / Device & Android
      description: 机型代号 + Android 版本 + ROM
      placeholder: Xiaomi 25098PN5AC / Android 17 / HyperOS 3
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题与复现 / Problem & steps
      description: 现象、出现频率、复现步骤、期望结果
      placeholder: |
        现象：...
        复现：1. ... 2. ...
        期望：...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息 / Diagnostics
      description: 粘贴完整的「复制诊断」文本；涉及充电问题时，请在会话结算完成后再复制
      placeholder: CRecordEvolution diag（已脱敏：无序列号/IMEI/MAC/账号）...
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认 / Checklist
      options:
        - label: 已使用最新 Release，重启/重装过，并搜索过现有 issue
          required: true
        - label: 诊断文本已完整粘贴，且确认不含序列号 / IMEI / MAC / 账号
          required: true
