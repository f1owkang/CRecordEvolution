name: Feature request / 功能建议
description: 建议新的统计口径、WebUI 功能或安装/诊断体验改进
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 issue，确认没有重复建议。
        描述越具体越好：使用场景、期望行为、是否有替代方案。
  - type: textarea
    id: usecase
    attributes:
      label: 使用场景 / Use case
      description: 你希望解决什么问题？在什么机型/系统上遇到？
      placeholder: 例如：希望在历史页按充电器功率筛选会话，因为 ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案 / Proposed solution
      description: 你期望的交互、展示或数据行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或补充 / Alternatives
      description: 可选；现有做法、其他模块的做法或参考截图
  - type: input
    id: device
    attributes:
      label: 机型与系统 / Device & Android
      description: 可选，便于判断功能是否依赖厂商节点
      placeholder: Xiaomi 25098PN5AC / Android 17
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认 / Checklist
      options:
        - label: 已搜索现有 issue，确认不是重复建议
          required: true
        - label: 该功能符合模块定位（本地电池健康与容量统计，不引入联网/上传）
          required: true
