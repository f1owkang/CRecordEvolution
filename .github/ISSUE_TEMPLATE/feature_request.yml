name: Feature request / 功能建议
description: 建议新的统计口径、WebUI 功能或安装/诊断体验改进
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 issue。功能需符合模块定位：本地电池健康与容量统计，不引入联网或上传。
  - type: textarea
    id: need
    attributes:
      label: 使用场景与期望方案 / Use case & proposal
      description: 遇到什么问题、希望怎么解决；可附截图或参考做法
      placeholder: |
        场景：...
        期望：...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 补充（可选）/ Extra
      description: 可选；现有替代做法、其他模块的做法或截图
