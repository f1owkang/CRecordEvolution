<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ChargingRecord Evolution</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: #0b0e14;
  color: #e6edf3;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  padding: 16px;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px; }
h1 { font-size: 18px; font-weight: 700; letter-spacing: .3px; }
.badge {
  font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
  border: 1px solid #30363d; color: #8b949e;
}
.badge.meas { color: #4ade80; background: rgba(74,222,128,.12); border-color: rgba(74,222,128,.35); }
.badge.kernel { color: #79c0ff; background: rgba(88,166,255,.12); border-color: rgba(88,166,255,.35); }
.err {
  display: none;
  background: rgba(248,113,113,.08);
  border: 1px solid rgba(248,113,113,.35);
  color: #fca5a5;
  border-radius: 12px;
  padding: 11px 14px;
  font-size: 13px;
  line-height: 1.5;
  word-break: break-all;
}
.hero {
  background: linear-gradient(160deg, #13221a 0%, #12161f 60%);
  border: 1px solid #23303c;
  border-radius: 16px;
  padding: 26px 20px;
  text-align: center;
}
.hero-line {
  font-size: 58px; font-weight: 700; line-height: 1.05;
  color: #4ade80;
  font-variant-numeric: tabular-nums;
}
.hero-line .unit { font-size: 26px; font-weight: 600; margin-left: 4px; color: #4ade80; }
.sub { margin-top: 8px; font-size: 13px; color: #9fb3c8; font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.cell {
  background: #151a23;
  border: 1px solid #232a36;
  border-radius: 12px;
  padding: 12px 14px;
  min-width: 0;
}
.cell .label { font-size: 12px; color: #8b949e; margin-bottom: 5px; }
.cell .val { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.panel {
  background: #151a23;
  border: 1px solid #232a36;
  border-radius: 12px;
  padding: 6px 14px 8px;
}
.ptitle { font-size: 13px; color: #8b949e; padding: 9px 0 3px; }
.row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid #1d242f;
  font-variant-numeric: tabular-nums;
}
.row:last-child { border-bottom: none; }
.row .t { color: #9fb3c8; }
.row.empty { justify-content: center; color: #6e7681; }
button#refresh {
  width: 100%;
  background: #238636;
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 13px;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}
button#refresh:hover:not(:disabled) { background: #2ea043; }
button#refresh:disabled { opacity: .55; cursor: default; }
.meta { font-size: 12px; color: #6e7681; text-align: center; font-variant-numeric: tabular-nums; }
.gate {
  display: none;
  flex-direction: column; align-items: center; gap: 8px;
  background: #151a23;
  border: 1px solid #232a36;
  border-radius: 16px;
  padding: 40px 24px;
  text-align: center;
}
.gate .gate-title { font-size: 16px; font-weight: 700; color: #e6edf3; }
.gate div:last-child { font-size: 13px; color: #8b949e; line-height: 1.6; }
.chart svg { display: block; width: 100%; height: auto; }
.cap { font-size: 12px; color: #8b949e; margin-top: 7px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ChargingRecord Evolution</h1>
    <span id="badge" class="badge">—</span>
  </header>

  <section id="err" class="err"></section>

  <main id="app" style="display:flex;flex-direction:column;gap:12px;">
    <section class="hero">
      <div class="hero-line"><span id="pct">--</span><span class="unit">%</span></div>
      <div id="sub" class="sub">正在获取数据…</div>
    </section>

    <section class="grid">
      <div class="cell"><div class="label">设计容量</div><div id="design" class="val">—</div></div>
      <div class="cell"><div class="label">当前容量</div><div id="full" class="val">—</div></div>
      <div class="cell"><div class="label">循环次数</div><div id="cycles" class="val">—</div></div>
      <div class="cell"><div class="label">实测估算</div><div id="est" class="val">—</div></div>
      <div class="cell"><div class="label">循环当量</div><div id="cyceq" class="val">—</div></div>
      <div class="cell"><div class="label">内阻</div><div id="rmoh" class="val">—</div></div>
      <div class="cell" style="grid-column: span 2;"><div class="label">容量趋势</div><div id="trend" class="val">—</div></div>
    </section>

    <section class="panel">
      <div class="ptitle">近期估算</div>
      <div id="recent"></div>
    </section>

    <section class="panel">
      <div class="ptitle">估算趋势</div>
      <div id="chart_est" class="chart"></div>
      <div id="chart_est_cap" class="cap"></div>
    </section>

    <section class="panel">
      <div class="ptitle">充电会话</div>
      <div id="chart_ses" class="chart"></div>
      <div id="chart_ses_cap" class="cap"></div>
    </section>

    <section class="panel">
      <div class="ptitle">静置电压</div>
      <div id="chart_rest" class="chart"></div>
      <div id="chart_rest_cap" class="cap"></div>
    </section>

    <button id="refresh" type="button">立即刷新</button>
    <div id="meta" class="meta"></div>
  </main>

  <section id="gate" class="gate">
    <div class="gate-title">无法连接管理器</div>
    <div>需要 KernelSU/APatch/MMRL 管理器</div>
  </section>
</div>

<script>
(function () {
  'use strict';
  var CMD_JSON = '/data/adb/modules/CRecordEvolution/bin/batteryd json';
  var CMD_ONCE = '/data/adb/modules/CRecordEvolution/bin/batteryd once';

  function $(id) { return document.getElementById(id); }

  var SEQ = 0;
  var TIMEOUT_MS = 15000;

  function normalize(a, b, c) {
    if (a && typeof a === 'object' && ('errno' in a || 'stdout' in a)) return a;
    return { errno: Number(a) || 0, stdout: b == null ? '' : String(b), stderr: c == null ? '' : String(c) };
  }

  function pickHost() {
    if (typeof ksu !== 'undefined' && ksu && typeof ksu.exec === 'function') return ksu;
    if (window.APatch && typeof window.APatch.exec === 'function') return window.APatch;
    if (window.apatch && typeof window.apatch.exec === 'function') return window.apatch;
    return null;
  }

  function hasExec() { return pickHost() != null; }

  // KernelSU / APatch / WebUI-X 官方协议：exec(cmd, optionsJson, 回调函数名字符串)
  function cbNameExec(host, cmd) {
    return new Promise(function (resolve) {
      var name = '__cr_cb_' + (++SEQ) + '_' + Date.now();
      var done = false;
      window[name] = function (errno, stdout, stderr) {
        if (done) return;
        done = true;
        try { delete window[name]; } catch (e) { window[name] = undefined; }
        resolve(normalize(errno, stdout, stderr));
      };
      try {
        host.exec(cmd, '{}', name);
      } catch (e) {
        if (!done) { done = true; resolve({ errno: -1, stdout: '', stderr: String(e) }); }
      }
    });
  }

  // 部分宿主的 exec 直接返回 Promise<{errno,stdout,stderr}>；不适用时 resolve(null)
  function promiseExec(host, cmd) {
    return new Promise(function (resolve) {
      var p;
      try { p = host.exec(cmd); } catch (e) { resolve(null); return; }
      if (p && typeof p.then === 'function') {
        p.then(function (r) { resolve(r && typeof r === 'object' ? normalize(r) : null); },
               function () { resolve(null); });
      } else { resolve(null); }
    });
  }

  // 旧式直调：exec(cmd, function(errno, stdout, stderr))；抛错或未回调则 resolve(null)
  function directCbExec(host, cmd) {
    return new Promise(function (resolve) {
      try {
        host.exec(cmd, function (a, b, c) { resolve(normalize(a, b, c)); });
      } catch (e) { resolve(null); }
    });
  }

  function run(cmd) {
    var host = pickHost();
    if (!host) {
      return Promise.resolve({ errno: -1, nohost: true, stdout: '', stderr: '' });
    }
    var kinds = [cbNameExec, promiseExec, directCbExec];
    return new Promise(function (resolve) {
      var settled = false;
      var timer = setTimeout(function () {
        if (!settled) { settled = true; resolve({ errno: -1, stdout: '', stderr: '执行超时' }); }
      }, TIMEOUT_MS);
      // errno=-1 视为该策略不可用，级联到下一种；其余（含命令本身的非零退出码）直接采纳
      function attempt(i) {
        if (settled) return;
        kinds[i](host, cmd).then(function (r) {
          if (settled) return;
          if (r && Number(r.errno) !== -1) { settled = true; clearTimeout(timer); resolve(r); return; }
          if (i + 1 < kinds.length) { setTimeout(function () { attempt(i + 1); }, 350); return; }
          settled = true; clearTimeout(timer); resolve({ errno: -1, stdout: '', stderr: '' });
        });
      }
      attempt(0);
    });
  }

  function pad(n) { n = String(n); return n.length < 2 ? '0' + n : n; }

  function hhmm(ts) {
    var d = new Date(Number(ts) * 1000);
    if (isNaN(d.getTime())) return '--:--';
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function setText(id, v) { var el = $(id); if (el) el.textContent = v; }
  function fmtInt(v) { return v == null ? '—' : String(v); }
  function fmtFix(v, n) { return v == null ? '—' : Number(v).toFixed(n); }

  function showError(msg) { var el = $('err'); if (el) { el.textContent = msg; el.style.display = 'block'; } }
  function hideError() { var el = $('err'); if (el) el.style.display = 'none'; }

  function render(doc) {
    var design = doc.design_mah;
    var est = doc.est_mah;
    if (est != null && design != null && Number(design) > 0) {
      setText('pct', String(Math.round(est / design * 100)));
      setText('badge', '实测');
      $('badge').className = 'badge meas';
      setText('sub', est + ' mAh / ' + design + ' mAh');
    } else {
      setText('pct', fmtInt(doc.pct));
      setText('badge', '内核');
      $('badge').className = 'badge kernel';
      setText('sub', doc.full_mah != null ? '当前容量 ' + doc.full_mah + ' mAh' : '\u00a0');
    }
    setText('design', fmtInt(design));
    setText('full', fmtInt(doc.full_mah));
    setText('cycles', fmtInt(doc.cycles));
    if (est != null) {
      var sg = Number(doc.est_mah_sigma);
      var sigmaTxt = (doc.channel === 'ml' && doc.est_mah_sigma != null && isFinite(sg)) ? ' ±' + Math.round(sg) + ' mAh' : '';
      setText('est', est + ' mAh' + sigmaTxt);
    } else {
      setText('est', '学习中 · 已采集 ' + fmtInt(doc.samples == null ? 0 : doc.samples) + ' 次');
    }
    setText('cyceq', fmtFix(doc.cycle_equiv, 2));
    setText('rmoh', doc.r_moh != null ? Number(doc.r_moh).toFixed(1) + ' mΩ' : '采集中');
    var tw = Number(doc.trend_mah_per_week);
    setText('trend', (doc.trend_mah_per_week != null && isFinite(tw)) ? '本周斜率 ' + tw.toFixed(1) + ' mAh/周' : '学习期');

    var list = $('recent');
    list.textContent = '';
    var rows = Array.isArray(doc.recent) ? doc.recent : [];
    if (!rows.length) {
      var empty = document.createElement('div');
      empty.className = 'row empty';
      empty.textContent = '暂无采样记录';
      list.appendChild(empty);
    } else {
      rows.forEach(function (r) {
        var li = document.createElement('div');
        li.className = 'row';
        var t = document.createElement('span');
        t.className = 't';
        t.textContent = hhmm(r && r.ts);
        var m = document.createElement('span');
        m.textContent = fmtInt(r && r.mah) + ' mAh';
        li.appendChild(t);
        li.appendChild(m);
        list.appendChild(li);
      });
    }
    setText('meta', '通道 ' + (doc.channel || '—') + ' · 更新于 ' + (doc.updated || '—'));
  }

  var CHART_W = 320;
  var CHART_H = 110;

  function chartPending() { return '<div class="row empty">采集中</div>'; }

  // 归一化结果内缩，避免描边/圆点贴边被 viewBox 裁切
  function spanPad(p) { return 0.05 + p * 0.9; }

  // pts: [{x,y}] 已归一化到 [0,1]
  function ptsToPath(pts, w, h) {
    return pts.map(function (p, i) { return (i ? 'L' : 'M') + (p.x * w).toFixed(1) + ',' + ((1 - p.y) * h).toFixed(1); }).join('');
  }

  function svgOpen(w, h) {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" role="img">';
  }

  function chartBase(w, h) {
    return '<line x1="0" y1="' + (h - 0.5) + '" x2="' + w + '" y2="' + (h - 0.5) + '" stroke="#232a36" stroke-width="1"/>';
  }

  function pickPairs(rows, kx, ky) {
    var out = [], i, r, x, y;
    for (i = 0; i < rows.length; i++) {
      r = rows[i];
      x = Number(r == null ? null : r[kx]);
      y = Number(r == null ? null : r[ky]);
      if (isFinite(x) && isFinite(y)) out.push({ x: x, y: y });
    }
    return out;
  }

  function minMax(vals) {
    var mn = Infinity, mx = -Infinity, i;
    for (i = 0; i < vals.length; i++) {
      if (vals[i] < mn) mn = vals[i];
      if (vals[i] > mx) mx = vals[i];
    }
    return { min: mn, max: mx };
  }

  function normPt(v, mn, mx) {
    if (!(mx > mn)) return 0.5;
    return (v - mn) / (mx - mn);
  }

  // data: [{ts,v}]，自动 min/max 归一化；不足 2 点返回提示文案
  // trendMpw: mAh/周 斜率；有效时按首尾 ts 两端点叠一条拟合虚线（下置于主折线之下，颜色区分）
  function svgLine(data, w, h, color, trendMpw) {
    var raw = pickPairs(Array.isArray(data) ? data : [], 'ts', 'mah');
    if (raw.length < 2) return chartPending();
    raw.sort(function (a, b) { return a.x - b.x; });
    var tx = minMax(raw.map(function (p) { return p.x; }));
    var ys = raw.map(function (p) { return p.y; });
    var trendPts = null;
    if (typeof trendMpw === 'number' && isFinite(trendMpw)) {
      var vEnd = raw[0].y + trendMpw * ((tx.max - tx.min) / 604800);
      trendPts = [{ x: raw[0].x, y: raw[0].y }, { x: tx.max, y: vEnd }];
      ys.push(trendPts[0].y, trendPts[1].y);
    }
    var ty = minMax(ys);
    function toXY(p) { return { x: spanPad(normPt(p.x, tx.min, tx.max)), y: spanPad(normPt(p.y, ty.min, ty.max)) }; }
    var pts = raw.map(toXY);
    var overlay = '';
    if (trendPts) {
      overlay = '<path d="' + ptsToPath(trendPts.map(toXY), w, h) + '" fill="none" stroke="#79c0ff" stroke-width="1.5" stroke-dasharray="6,4" stroke-linecap="round"/>';
    }
    return svgOpen(w, h) + chartBase(w, h) + overlay +
      '<path d="' + ptsToPath(pts, w, h) + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>';
  }

  // rest_points 散点：每点一个 <circle>
  function svgScatter(data, w, h, color) {
    var raw = pickPairs(Array.isArray(data) ? data : [], 'ts', 'uv');
    if (raw.length < 2) return chartPending();
    var tx = minMax(raw.map(function (p) { return p.x; }));
    var ty = minMax(raw.map(function (p) { return p.y; }));
    var dots = raw.map(function (p) {
      var cx = (spanPad(normPt(p.x, tx.min, tx.max)) * w).toFixed(1);
      var cy = ((1 - spanPad(normPt(p.y, ty.min, ty.max))) * h).toFixed(1);
      return '<circle cx="' + cx + '" cy="' + cy + '" r="3" fill="' + color + '" fill-opacity=".85"/>';
    }).join('');
    return svgOpen(w, h) + chartBase(w, h) + dots + '</svg>';
  }

  // sessions delta 条形：每条会话一个 <rect>，高度按 delta_mah 占比
  function svgBars(data, w, h, color) {
    var rows = Array.isArray(data) ? data : [];
    var vals = [], i, v;
    for (i = 0; i < rows.length; i++) {
      v = Number(rows[i] == null ? null : rows[i].delta_mah);
      if (isFinite(v)) vals.push(v);
    }
    if (vals.length < 2) return chartPending();
    var mx = minMax(vals).max;
    if (!(mx > 0)) mx = 1;
    var slot = w / vals.length;
    var bw = Math.min(slot * 0.62, 26);
    var rects = '';
    for (i = 0; i < vals.length; i++) {
      var bh = Math.max(vals[i] / mx * (h - 6), 2);
      rects += '<rect x="' + (i * slot + (slot - bw) / 2).toFixed(1) + '" y="' + (h - bh).toFixed(1) +
        '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="3" fill="' + color + '"/>';
    }
    return svgOpen(w, h) + chartBase(w, h) + rects + '</svg>';
  }

  function setChart(id, html, cap) {
    var el = $(id);
    if (!el) return;
    el.innerHTML = html;
    setText(id + '_cap', cap || '');
  }

  function renderCharts(doc) {
    if (!doc || typeof doc !== 'object') doc = {};
    var W = CHART_W, H = CHART_H;

    var recent = Array.isArray(doc.recent) ? doc.recent : [];
    var estParts = [];
    var latest = recent.length ? recent[recent.length - 1] : null;
    if (recent.length >= 2 && latest != null) estParts.push('最新 ' + fmtInt(latest.mah) + ' mAh');
    if (doc.samples_n != null) estParts.push('累计采样 ' + fmtInt(doc.samples_n) + ' 次');
    var tw = Number(doc.trend_mah_per_week);
    setChart('chart_est', svgLine(recent, W, H, '#4ade80',
      (doc.trend_mah_per_week != null && isFinite(tw)) ? tw : null), estParts.join(' · '));

    var sesRows = (Array.isArray(doc.sessions) ? doc.sessions : []).filter(function (s) {
      return !!(s && s.valid);
    });
    var sesSum = 0, i, dv;
    for (i = 0; i < sesRows.length; i++) {
      dv = Number(sesRows[i].delta_mah);
      if (isFinite(dv)) sesSum += dv;
    }
    setChart('chart_ses', svgBars(sesRows, W, H, '#79c0ff'),
      sesRows.length >= 2 ? '有效会话 ' + sesRows.length + ' 次 · 合计 ' + fmtInt(Math.round(sesSum)) + ' mAh' : '');

    var restRows = Array.isArray(doc.rest_points) ? doc.rest_points : [];
    var uvs = [];
    for (i = 0; i < restRows.length; i++) {
      dv = Number(restRows[i] == null ? null : restRows[i].uv);
      if (isFinite(dv)) uvs.push(dv);
    }
    var ur = uvs.length >= 2 ? minMax(uvs) : null;
    setChart('chart_rest', svgScatter(restRows, W, H, '#e6edf3'),
      ur ? '区间 ' + (ur.min / 1e6).toFixed(3) + ' ~ ' + (ur.max / 1e6).toFixed(3) + ' V' : '');
  }

  function fetchData() {
    return run(CMD_JSON).then(function (r) {
      if (r.errno !== 0) {
        showError('执行失败：' + (r.stderr || ('errno ' + r.errno)));
        return;
      }
      var stdout = (r.stdout || '').trim();
      if (!stdout) {
        showError('无输出：batteryd 未返回数据');
        return;
      }
      var doc;
      try {
        doc = JSON.parse(stdout);
      } catch (e) {
        showError('数据解析失败：输出不是有效 JSON');
        return;
      }
      if (!doc || typeof doc !== 'object') {
        showError('数据解析失败：意外的数据结构');
        return;
      }
      hideError();
      try {
        render(doc);
        renderCharts(doc);
      } catch (e) {
        showError('渲染失败：' + e.message);
      }
    });
  }

  function refreshNow() {
    var btn = $('refresh');
    if (!btn || btn.disabled) return;
    btn.disabled = true;
    var old = btn.textContent;
    btn.textContent = '刷新中…';
    run(CMD_ONCE).then(function () {
      setTimeout(function () {
        var done = function () { btn.disabled = false; btn.textContent = old; };
        fetchData().then(done, done);
      }, 1000);
    });
  }

  function init() {
    if (!hasExec()) {
      $('app').style.display = 'none';
      $('err').style.display = 'none';
      $('gate').style.display = 'flex';
      return;
    }
    $('refresh').addEventListener('click', refreshNow);
    fetchData();
    setInterval(fetchData, 60000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
